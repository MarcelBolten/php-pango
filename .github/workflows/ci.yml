name: Build and Test

on:
    push:
        branches:
            - '*'
    pull_request:

jobs:
    Build_Test_Coverage:
        strategy:
            fail-fast: false
            matrix:
                php-version: [8.2, 8.3, 8.4, 8.5]
                os: [ubuntu-latest]
                phpts: [ts, nts]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                build-essential autoconf libtool bison re2c pkg-config \
                libssl-dev libxml2-dev libcairo2-dev libpango1.0-dev \
                libjpeg-turbo8-dev valgrind lcov wget ca-certificates gzip \
                fonts-noto-cjk gdb

            # perhaps need to install some fonts but ubuntu loads too many by default in fonts-noto
            # fonts-noto fonts-noto-cjk fonts-noto-color-emoji

            - name: "Set up PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  tools: pie
              env:
                debug: true
                phpts: ${{ matrix.phpts }}

            - name: "Build Cairo dependency with PIE"
              # Todo: use a stable version after it is released not dev-overhaul branch
              run: sudo pie install marcelbolten/php-cairo:dev-overhaul

            - name: "Checkout"
              uses: actions/checkout@v5

            - name: "Build Pango"
              run: |
                phpize
                ./configure --with-php-config=$(which php-config)
                make -j$(nproc)
                sudo make -j$(nproc) install
              env:
                CFLAGS: "-ggdb3"
                PANGO_COVERAGE: yes

            - name: "Enable Pango extension"
              run: |
                # Extract the additional ini files directory from PHP configuration
                INI_DIR=$(php -i | grep "Scan this dir for additional .ini files" | sed 's/.*=> //')
                echo "Additional ini directory: $INI_DIR"
                # Create 25-pango.ini to ensure pango loads after cairo (20-cairo.ini)
                echo "extension=pango.so" | sudo tee "$INI_DIR/25-pango.ini"
                echo "Created $INI_DIR/25-pango.ini"

            - name: "Show versions"
              run: |
                php -v
                php --ri cairo
                php --ri pango
              continue-on-error: true

            - name: "Setup fontconfig cache"
              run: |
                mkdir -p ~/.cache/fontconfig
                mkdir -p ~/.fontconfig
                # Set fontconfig cache location
                echo "FONTCONFIG_PATH=/etc/fonts" >> $GITHUB_ENV
                echo "XDG_CACHE_HOME=$HOME/.cache" >> $GITHUB_ENV
                # Build font cache
                fc-cache -fv

            - name: "Run Tests"
              run: |
                php ./run-tests.php -j$(nproc) -q --show-diff

            - name: "Upload test outputs"
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                name: pango-test-${{ matrix.php-version }}-${{ matrix.phpts }}
                path: tests/**/*.log

            - name: "Create Coverage report"
              if: ${{ matrix.php-version == '8.4' && matrix.phpts == 'nts' && github.ref_name == 'modern_php' }}
              run: chmod +x ./coverage.sh && ./coverage.sh

            - name: "Publish on gh-pages"
              if: ${{ matrix.php-version == '8.4' && matrix.phpts == 'nts' && github.ref_name == 'modern_php' }}
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./coverage_html

            - name: "Upload coverage report artifacts"
              if: ${{ matrix.php-version == '8.4' && matrix.phpts == 'nts' && github.ref_name == 'modern_php' }}
              uses: actions/upload-artifact@v4
              with:
                name: pango-coverage-8.4
                path: coverage_html
