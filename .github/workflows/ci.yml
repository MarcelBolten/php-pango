name: Build and Test

on:
    push:
        branches:
            - '*'
    pull_request:

jobs:
    Build_Test_Coverage:
        strategy:
            fail-fast: false
            matrix:
                php-version: [8.2, 8.3, 8.4, 8.5]
                os: [ubuntu-latest]
                phpts: [ts, nts]

        runs-on: ${{ matrix.os }}

        steps:
            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y --no-install-recommends \
                build-essential autoconf libtool bison re2c pkg-config \
                libssl-dev libxml2-dev libcairo2-dev \
                libjpeg-turbo8-dev valgrind lcov wget ca-certificates gzip \
                fonts-noto-cjk gdb \
                meson-1.5 ninja-build \
                libglib2.0-dev \
                libfontconfig1-dev \
                libfreetype-dev \
                libharfbuzz-dev \
                libthai-dev \
                libxft-dev \
                libxrender-dev \
                libfribidi-dev \
                libx11-dev \
                libfreetype6-dev

            # perhaps need to install some fonts but ubuntu loads too many by default in fonts-noto
            # fonts-noto fonts-noto-cjk fonts-noto-color-emoji

            - name: Build modified Pango
              run: |
                git clone --depth 1 --branch marcel-1.52.1-join-fc-thread \
                  https://github.com/MarcelBolten/pango.git
                cd pango
                meson setup build \
                  -Dintrospection=disabled \
                  -Dgtk_doc=false

                meson compile -C build
                sudo meson install -C build

                ls -la /usr/local/lib/x86_64-linux-gnu/libpango*
                ls -la /usr/local/lib/x86_64-linux-gnu/pkgconfig/pango*

                ldconfig

            - name: "Setup fontconfig cache"
              run: |
                mkdir -p ~/.cache/fontconfig
                mkdir -p ~/.fontconfig
                # Set fontconfig cache location
                echo "FONTCONFIG_PATH=/etc/fonts" >> $GITHUB_ENV
                echo "XDG_CACHE_HOME=$HOME/.cache" >> $GITHUB_ENV
                # Build font cache
                fc-cache -fv

            - name: test if all dependencies are installed
              run: |
                pkg-config --modversion pango
                pkg-config --cflags pango
                pkg-config --libs pango
                pkg-config --debug pango 2>&1

            - name: "Set up PHP"
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-version }}
                  tools: pie
              env:
                debug: true
                phpts: ${{ matrix.phpts }}

            - name: "Build Cairo dependency with PIE"
              # Todo: use a stable version after it is released not dev-overhaul branch
              run: sudo pie install marcelbolten/php-cairo:dev-overhaul

            - name: "Checkout"
              uses: actions/checkout@v5

            - name: "Build Pango"
              run: |
                phpize
                ./configure --with-php-config=$(which php-config)
                make -j$(nproc)
                sudo make -j$(nproc) install
              env:
                CFLAGS: "-ggdb3"
                PANGO_COVERAGE: yes

            - name: "Show versions"
              run: |
                php -v || true
                php -i || true
                php --ri cairo || true
                php -d extension=pango.so --ri pango || true
              continue-on-error: true

            - name: "enable pango extension"
              run: |
                # Extract the additional ini files directory from PHP configuration
                INI_DIR=$(php -i | grep "Scan this dir for additional .ini files" | awk -F ' => ' '{print $2}')
                if [ -z "$INI_DIR" ] || [ "$INI_DIR" = "(none)" ]; then
                  echo "Error: Could not determine additional ini directory from php -i"
                  php -i | grep -i "scan\|additional"
                  exit 1
                fi
                if [ ! -d "$INI_DIR" ]; then
                  echo "Error: Directory $INI_DIR does not exist"
                  exit 1
                fi
                echo "Additional ini directory: $INI_DIR"
                # Create 25-pango.ini to ensure pango loads after cairo (20-cairo.ini)
                echo "extension=pango.so" | sudo tee "$INI_DIR/25-pango.ini"
                echo "Created $INI_DIR/25-pango.ini"
                php -i | grep pango
                php --ri pango

            - name: "Run Tests"
              run: php ./run-tests.php -j$(nproc) --repeat 2 -q --show-diff

            - name: "Upload test outputs"
              if: ${{ always() }}
              uses: actions/upload-artifact@v4
              with:
                name: pango-test-${{ matrix.php-version }}-${{ matrix.phpts }}
                path: tests/**/*.log

            - name: "Create Coverage report"
              if: ${{ matrix.php-version == '8.4' && matrix.phpts == 'nts' && github.ref_name == 'modern_php' }}
              run: chmod +x ./coverage.sh && ./coverage.sh

            - name: "Publish on gh-pages"
              if: ${{ matrix.php-version == '8.4' && matrix.phpts == 'nts' && github.ref_name == 'modern_php' }}
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: ./coverage_html

            - name: "Upload coverage report artifacts"
              if: ${{ matrix.php-version == '8.4' && matrix.phpts == 'nts' && github.ref_name == 'modern_php' }}
              uses: actions/upload-artifact@v4
              with:
                name: pango-coverage-8.4
                path: coverage_html
